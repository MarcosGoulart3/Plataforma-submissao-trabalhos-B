x-app-env: &app-env
  NODE_ENV: production
  APP_PUBLIC_URL: http://localhost:3333
  DATABASE_URL: postgresql://grande:grande@postgres:5432/grande?schema=public
  PGBOSS_SCHEMA: pgboss
  JWT_SECRET: troque-este-segredo-em-producao-com-32+-caracteres
  JWT_EXPIRES_IN: 1d
  MAX_UPLOAD_MB: 10
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: grande
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  MAIL_DRIVER: smtp
  SMTP_HOST: mailhog
  SMTP_PORT: 1025
  MAIL_FROM: Grande <nao-responda@grande.local>

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grande
      POSTGRES_PASSWORD: grande
      POSTGRES_DB: grande
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grande -d grande"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interface web: http://localhost:8025

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console: http://localhost:9001
    volumes:
      - miniodata:/data

  api:
    build: .
    # aplica as migrations antes de subir; o worker espera a API ficar saudável
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    environment: *app-env
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: node dist/workers/index.js
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
      mailhog:
        condition: service_started
    # escala horizontalmente: o pg-boss usa SKIP LOCKED, dois workers nunca pegam o mesmo job
    deploy:
      replicas: 1

volumes:
  pgdata:
  miniodata:
